name: Destiny Fleet Worker

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's fastest)
  workflow_dispatch: {}      # lets you press "Run workflow" by hand

concurrency:
  group: fleet-worker
  cancel-in-progress: false  # never run two at once

permissions:
  contents: read

jobs:
  run-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            pip install httpx websockets cryptography pydantic supabase
          fi

      - name: Run the fleet (one cycle, max 4 minutes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set +e
          timeout 240 python backend/worker.py
          code=$?
          # 124 = hit the 4-minute limit (fine for a looping worker)
          if [ $code -eq 124 ]; then exit 0; fi
          exit $code

      - name: Save snapshots (proof the agents ran)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-snapshots
          path: backend/snapshots/
          if-no-files-found: ignore
          retention-days: 3
